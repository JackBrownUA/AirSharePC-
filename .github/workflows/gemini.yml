name: Gemini AI Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Задание для Gemini (что сделать в коде)'
        required: true
        default: 'Проверь код проекта, найди ошибки и внеси исправления'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gemini:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment && contains(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ github.event.inputs.prompt || github.event.comment.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
