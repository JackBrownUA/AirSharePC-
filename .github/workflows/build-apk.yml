name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify modular files, lint with ruff and run unit tests
        run: |
          rm -f tls_cert.py
          for req_file in main.py server.py web_ui.py player_ui.py security.py pwa_search.py android_bridge.py ui_widgets.py themes.py utils.py config.py i18n.py p4a_hook.py buildozer.spec; do
            if [ ! -f "$req_file" ]; then
              echo "ERROR: Missing required module $req_file in repository root!"
              exit 1
            fi
          done
          python -m pip install --upgrade pip ruff pytest
          ruff check --select E9,F .
          python -m unittest -v test_airshare.py

      - name: Set up Java 17 (Required for Android SDK & Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            .buildozer
          key: buildozer-master-v11-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a_hook.py') }}
          restore-keys: |
            buildozer-master-v11-${{ runner.os }}-
            buildozer-master-v9-${{ runner.os }}-
            buildozer-master-v8-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint libtool pkg-config \
            libffi-dev libssl-dev libltdl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libsndfile1-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libfreetype6-dev libgles2-mesa-dev libunwind-dev \
            lld gettext patch dos2unix git zip unzip wget \
            bison flex ccache python3-virtualenv openjdk-17-jdk

      - name: Install Python build dependencies
        run: |
          echo "charset-normalizer==2.1.1" > /tmp/pip-constraints.txt
          mkdir -p "$HOME/.config/pip"
          printf "[global]\nconstraint = /tmp/pip-constraints.txt\n" > "$HOME/.config/pip/pip.conf"
          python -m pip install --upgrade pip setuptools wheel
          pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33" \
            "charset-normalizer==2.1.1" \
            virtualenv appdirs "colorama>=0.3.3" jinja2 \
            "sh>=1.10,<2.0" meson ninja toml packaging build
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Prepare Android SDK Command Line Tools & Licenses (API 35)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools" "$SDK_DIR/tools/bin" "$SDK_DIR/licenses"
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$SDK_DIR/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            rm -rf latest
            mv cmdline-tools latest
            rm -f commandlinetools-linux-11076708_latest.zip
          fi
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
          chmod +x "$SDK_DIR/cmdline-tools/latest/bin/"* "$SDK_DIR/tools/bin/"* || true
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses || true
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "platforms;android-34" "platforms;android-35" "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.0" || true

      - name: Build Debug APK (v1.3.5, Target API 35)
        run: |
          rm -f tls_cert.py
          find "$HOME/.buildozer" .buildozer "$HOME/.cache" -name "charset_normalizer-3*" -delete 2>/dev/null || true
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/venv 2>/dev/null || true
          rm -rf .buildozer/android/platform/build-arm64-v8a/dists/*/build 2>/dev/null || true
          python p4a_hook.py
          yes | buildozer -v android debug
          AAPT_BIN=$(find "$HOME/.buildozer/android/platform/android-sdk/build-tools" -name "aapt" | sort -V | tail -n 1)
          if [ -n "$AAPT_BIN" ]; then
            "$AAPT_BIN" dump badging bin/*.apk | grep -E "package:|sdkVersion:|targetSdkVersion:" || true
          fi
        env:
          DEBIAN_FRONTEND: noninteractive
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          PIP_CONSTRAINT: /tmp/pip-constraints.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airshare-apk
          path: bin/*.apk
          
