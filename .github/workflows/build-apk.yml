name: Build AirShare PC (Kotlin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Original AirShare PC Icon
        run: |
          COMMIT=$(git log -1 --diff-filter=A --format=%H -- icon.png)
          if [ -n "$COMMIT" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            git show "$COMMIT:icon.png" > orig_icon.png
            mkdir -p app/src/main/res/drawable-nodpi
            convert orig_icon.png -gravity center -crop 72%x72%+0+0 +repage -resize 432x432 app/src/main/res/drawable-nodpi/ic_launcher_fg.png
            convert orig_icon.png -resize 512x512 app/src/main/res/drawable-nodpi/app_logo.png
            for pair in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
              DIR="app/src/main/res/${pair%%:*}"
              SZ="${pair##*:}"
              mkdir -p "$DIR"
              convert orig_icon.png -gravity center -crop 72%x72%+0+0 +repage -resize "${SZ}x${SZ}" "$DIR/ic_launcher.png"
              cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
            done
            rm -f orig_icon.png
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release AAB & APK
        if: steps.keystore.outputs.ready == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: airshare-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB & APK
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: airshare-release-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
