name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17 (Required for Android SDK & Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-ndk25b-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint libtool pkg-config \
            libffi-dev libssl-dev libltdl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libsndfile1-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libfreetype6-dev libgles2-mesa-dev libunwind-dev \
            lld gettext patch dos2unix git zip unzip wget \
            bison flex ccache python3-virtualenv openjdk-17-jdk

      - name: Install Python build dependencies
        run: |
          cat << 'EOF' > /tmp/pip-constraints.txt
          setuptools<70.0.0
          wheel<0.44.0
          cython==0.29.33
          EOF
          python -m pip install --upgrade "pip<24.1" "setuptools<70.0.0" "wheel<0.44.0"
          pip install --constraint /tmp/pip-constraints.txt \
            "buildozer==1.5.0" \
            "cython==0.29.33" \
            virtualenv appdirs "colorama>=0.3.3" jinja2 \
            "sh>=1.10,<2.0" meson ninja toml packaging build
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Prepare Android SDK Command Line Tools & Licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools" "$SDK_DIR/tools/bin" "$SDK_DIR/licenses"
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$SDK_DIR/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            rm -rf latest
            mv cmdline-tools latest
            rm -f commandlinetools-linux-11076708_latest.zip
          fi
          rm -f "$SDK_DIR/tools/bin/sdkmanager" "$SDK_DIR/tools/bin/avdmanager"
          cat << 'EOF' > "$SDK_DIR/tools/bin/sdkmanager"
          #!/usr/bin/env bash
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          for arg in "$@"; do
            if [ "$arg" = "--list" ]; then
              "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "$@" | grep -vE "build-tools;(35|36|37)\."
              exit 0
            fi
          done
          exec "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "$@"
          EOF
          chmod +x "$SDK_DIR/tools/bin/sdkmanager" "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses || true
          yes | "$SDK_DIR/tools/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "build-tools;34.0.0" || true
          rm -rf "$SDK_DIR/build-tools/3
