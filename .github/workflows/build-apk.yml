name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # ВАЖНО: Используем ubuntu-22.04, а не ubuntu-latest. 
    # В 22.04 есть все библиотеки, которые требует Buildozer, и нет проблем с libtinfo5.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libsndfile1-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libfreetype6-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libgles2-mesa-dev \
            git zip unzip
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33
      
      - name: Force Accept Android SDK Licenses for Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license
      
      - name: Build APK
        run: buildozer -v android debug
        env:
          DEBIAN_FRONTEND: noninteractive
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airshare-apk
          path: bin/*.apk
