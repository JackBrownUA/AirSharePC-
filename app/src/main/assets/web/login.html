<!DOCTYPE html>
<html lang="__INIT_LANG__" data-theme="__INIT_THEME__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirShare PC</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="bg-scene">
    <div class="bg-layer" id="layer-far"></div>
    <div class="bg-layer" id="layer-near"></div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <button class="btn" id="btn-theme" type="button">☀ / 🌙</button>
        <select class="lang-select" id="lang-select">
          <option value="en">EN</option>
          <option value="ru">RU</option>
          <option value="uk">UK</option>
          <option value="es">ES</option>
          <option value="de">DE</option>
          <option value="lt">LT</option>
        </select>
      </div>

      <div class="brand-logo" style="width:56px;height:56px;font-size:26px;margin:0 auto 12px;">A</div>
      <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">AirShare PC</h1>
      <p id="login-sub" style="font-size:13px;color:var(--muted);margin-bottom:18px;"></p>

      <div id="status-area" class="status-box" style="display:none;"></div>
      <div id="code-display" class="code-big" style="display:none;"></div>

      <button class="btn btn-primary" id="btn-connect-bio" type="button" style="width:100%;padding:12px;font-size:14px;margin-bottom:10px;"></button>
      <button class="btn" id="btn-connect-pairs" type="button" style="width:100%;padding:10px;margin-bottom:10px;"></button>

      <details id="pin-details" style="margin-top:8px;text-align:left;">
        <summary id="pin-summary" style="cursor:pointer;font-size:13px;color:var(--muted);text-align:center;padding:6px;"></summary>
        <form id="pin-form" style="margin-top:8px;">
          <input class="login-input" id="pin-input" type="password" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="••••••">
          <button class="btn btn-primary" id="btn-pin-submit" type="submit" style="width:100%;padding:10px;"></button>
        </form>
      </details>
    </div>

    <div class="app-footer">Crafted by JackBrownUA • Powered by Gemini</div>
  </div>

  <script>
    window.__INIT_LANG__ = "__INIT_LANG__";
    window.__INIT_THEME__ = "__INIT_THEME__";
    window.__I18N__ = __INIT_I18N__;
  </script>
  <script src="/assets/login.js"></script>
</body>
</html>
